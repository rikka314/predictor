# Merge these blocks into your site vhost (for example gfm156.com).
# This template assumes Streamlit runs at 127.0.0.1:8503
# and Streamlit config has: baseUrlPath = "predictor".

location = /predictor {
    return 302 /predictor/;
}

location ^~ /predictor/ {
    proxy_pass http://127.0.0.1:8503;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 86400;
    proxy_send_timeout 86400;
    proxy_buffering off;
    proxy_redirect off;
}
